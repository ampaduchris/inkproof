[project]
name = "inkproof"
version = "0.0.0"
description = "Redact PDFs and prove the text layer is gone, not just covered."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Chris Ampadu" }]
dependencies = [
    "pymupdf>=1.24",
    "pdfminer.six>=20231228",
    "typer>=0.12",
]

[project.scripts]
inkproof = "inkproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkproof"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "mutmut>=3",
    "reportlab>=4",
    "pypdf>=7.1.1",
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(id): the requirement id this test proves (REQ-###)"]
